name: Daily US Peak Automation & Health Audit

on:
  schedule:
    # 毎日 日本時間 07:30 (UTC 22:30) に自動トリガー
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  audit-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Edge API & Stripe Endpoint Health Check
        run: |
          echo "Auditing API endpoint health..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://pr-audit-api.ikeda-lef.workers.dev/health)
          echo "Edge Status Code: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "API check warning: expected 200, got $STATUS"
          else
            echo "All Edge services operational."
          fi

      - name: Log Peak Automation Timestamp
        run: |
          echo "Target US developers peak window reached at $(date -u)" >> audit-log.txt
