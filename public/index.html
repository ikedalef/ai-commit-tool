<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Git Commit & PR Generator</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; line-height: 1.6; color: #1f2937; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p.desc { color: #4b5563; font-size: 14px; margin-top: 0; }
    textarea { width: 100%; height: 180px; box-sizing: border-box; padding: 12px; font-family: monospace; font-size: 13px; border: 1px solid #d1d5db; border-radius: 6px; }
    button { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 500; margin-top: 12px; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    pre { background: #f3f4f6; padding: 16px; border-radius: 6px; white-space: pre-wrap; font-size: 14px; border: 1px solid #e5e7eb; }
    .share-box { margin-top: 16px; padding: 12px; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 6px; font-size: 14px; display: none; }
    .footer { margin-top: 48px; border-top: 1px solid #e5e7eb; padding-top: 24px; text-align: center; font-size: 14px; color: #6b7280; }
  </style>
</head>
<body>
  <h1>AI Git Commit & PR Generator</h1>
  <p class="desc"><code>git diff</code> の出力を貼り付けると、規約（Conventional Commits）に準拠したコミット文とPR要約を即座に生成します。</p>

  <textarea id="diffInput" placeholder="git diff の内容を貼り付けてください..."></textarea>
  <button id="btn" onclick="generate()">コミット文を自動生成する</button>

  <div id="shareBox" class="share-box">
    公開URLが自動生成されました: <a id="shareLink" href="#" target="_blank"></a>
  </div>

  <h3>生成結果:</h3>
  <pre id="output">ここに結果が表示されます。</pre>

  <div class="footer">
    <a href="https://buymeacoffee.com/" target="_blank" style="color:#2563eb; text-decoration:none;">☕ 開発者にコーヒーをおごる</a>
  </div>

  <script>
    async function generate() {
      const diff = document.getElementById('diffInput').value.trim();
      const btn = document.getElementById('btn');
      const output = document.getElementById('output');
      const shareBox = document.getElementById('shareBox');
      const shareLink = document.getElementById('shareLink');

      if (!diff) {
        alert("Git Diff を入力してください。");
        return;
      }

      btn.disabled = true;
      btn.innerText = "生成中...";
      output.innerText = "AIが解析・生成しています...";
      shareBox.style.display = "none";

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ diffText: diff })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error);

        output.innerText = data.result;

        if (data.shareUrl) {
          shareLink.href = data.shareUrl;
          shareLink.innerText = window.location.origin + data.shareUrl;
          shareBox.style.display = "block";
        }
      } catch (err) {
        output.innerText = "エラー: " + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = "コミット文を自動生成する";
      }
    }
  </script>
</body>
</html>
