<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Git Commit & PR Generator | Git差分からコミット文・PR要約を自動生成</title>
  
  <!-- SEO メタタグ -->
  <meta name="description" content="Gitの差分（git diff）を貼り付けるだけで、Conventional Commits規約に準拠したコミット文とPR要約を即座に自動生成。完全無料・登録不要。">
  <meta name="keywords" content="Git,コミットメッセージ,Conventional Commits,プルリクエスト,AI生成,自動化,git diff,開発効率化">
  <meta name="robots" content="index, follow">

  <!-- SNS / OGP プレビュー設定 -->
  <meta property="og:title" content="AI Git Commit & PR Generator | Git差分からコミット文を即座に自動生成">
  <meta property="og:description" content="面倒なコミットメッセージとPR要約の作成をAIが完全自動化。Conventional Commits完全準拠。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ai-commit-tool.ikeda-lef.workers.dev">
  <meta name="twitter:card" content="summary">

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-8 px-4 flex justify-center items-center">
  <main class="max-w-2xl w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
    
    <!-- タイトル・概要 -->
    <header class="text-center space-y-2">
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-teal-300">
        AI Git Commit & PR Generator
      </h1>
      <p class="text-xs sm:text-sm text-slate-400">
        Gitの変更差分（diff）を貼り付けるだけで、標準規約に沿ったコミット文とPR要約を即座に自動生成します。
      </p>
    </header>

    <!-- 3ステップ ガイド -->
    <section class="grid grid-cols-3 gap-3 bg-slate-900/60 p-4 rounded-xl border border-slate-700/60 text-xs">
      <div class="space-y-1">
        <span class="inline-block px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 font-bold">Step 1</span>
        <p class="text-slate-300 font-medium">差分を取得</p>
        <p class="text-slate-500 text-[11px]"><code>git diff</code> の出力をコピー</p>
      </div>
      <div class="space-y-1 border-x border-slate-700/60 px-2">
        <span class="inline-block px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 font-bold">Step 2</span>
        <p class="text-slate-300 font-medium">入力＆生成</p>
        <p class="text-slate-500 text-[11px]">下の枠に貼り付けて実行</p>
      </div>
      <div class="space-y-1">
        <span class="inline-block px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 font-bold">Step 3</span>
        <p class="text-slate-300 font-medium">即座に反映</p>
        <p class="text-slate-500 text-[11px]">コミットやPRにそのまま使用</p>
      </div>
    </section>

    <!-- 入力エリア -->
    <section class="space-y-2">
      <div class="flex justify-between items-center text-xs">
        <label for="diffInput" class="text-slate-300 font-medium">Git Diff（差分テキスト）</label>
        <button id="sampleBtn" class="text-blue-400 hover:text-blue-300 underline cursor-pointer">テスト用サンプルを入力</button>
      </div>
      <textarea id="diffInput" rows="5" placeholder="+ console.log('Hello World');" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 font-mono text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 transition-colors"></textarea>
      <button id="generateBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-blue-600/20 active:scale-[0.99] cursor-pointer">
        コミット文を自動生成する
      </button>
    </section>

    <!-- 出力エリア -->
    <section class="space-y-2">
      <div class="flex justify-between items-center text-xs">
        <label class="text-slate-300 font-medium">生成結果</label>
        <button id="copyBtn" class="hidden text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1 rounded transition cursor-pointer">コピー</button>
      </div>
      <pre id="resultArea" class="bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-xs text-slate-300 whitespace-pre-wrap min-h-[90px] flex items-center justify-center text-slate-600">ここに生成結果が表示されます</pre>
    </section>

    <!-- フッター説明 -->
    <footer class="text-center text-[11px] text-slate-500 border-t border-slate-800 pt-4">
      Conventional Commits（<code>feat:</code>, <code>fix:</code>, <code>refactor:</code>, <code>docs:</code> 等）に完全準拠
    </footer>

  </main>

  <script>
    const btn = document.getElementById('generateBtn');
    const input = document.getElementById('diffInput');
    const result = document.getElementById('resultArea');
    const copyBtn = document.getElementById('copyBtn');
    const sampleBtn = document.getElementById('sampleBtn');

    sampleBtn.addEventListener('click', () => {
      input.value = "diff --git a/src/app.js b/src/app.js\n--- a/src/app.js\n+++ b/src/app.js\n@@ -5,3 +5,4 @@\n- const timeout = 1000;\n+ const timeout = 3000;\n+ console.log('connection timeout updated');";
    });

    btn.addEventListener('click', async () => {
      const diff = input.value.trim();
      if (!diff) {
        result.textContent = 'Gitの差分（diff）を入力してください。';
        result.classList.remove('items-center', 'justify-center', 'text-slate-600');
        return;
      }

      btn.disabled = true;
      btn.textContent = '生成中...';
      result.textContent = 'AIが解析中...';
      result.classList.remove('items-center', 'justify-center', 'text-slate-600');

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ diff })
        });
        const data = await res.json();
        const text = data.commit || data.commitMessage || data.message || data.result || '生成に失敗しました。';
        result.textContent = text;
        copyBtn.classList.remove('hidden');
      } catch (err) {
        result.textContent = '通信エラーが発生しました。';
      } finally {
        btn.disabled = false;
        btn.textContent = 'コミット文を自動生成する';
      }
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(result.textContent);
      copyBtn.textContent = 'コピー完了！';
      setTimeout(() => { copyBtn.textContent = 'コピー'; }, 2000);
    });
  </script>
</body>
</html>
